    var err = document.getElementById('pwd-gate-err');
    function tryUnlock(pwd) {
      try {
        var bytes = CryptoJS.AES.decrypt(CIPHER, pwd);
        var plain = bytes.toString(CryptoJS.enc.Utf8);
        if (!plain) throw new Error('empty');
        content.innerHTML = plain;
        gate.style.display = 'none';
        content.style.display = '';
        try { localStorage.setItem('blogArchivePwd', pwd); } catch (e) {}
        return true;
      } catch (e) {
        return false;
      }
    }
    try {
      var saved = localStorage.getItem('blogArchivePwd');
      if (saved && tryUnlock(saved)) return;
    } catch (e) {}
    btn.addEventListener('click', function(){
      if (!tryUnlock(input.value)) {
        err.style.display = '';
      }
    });
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter') btn.click();
    });
  })();
